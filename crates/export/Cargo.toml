[package]
name = "databrain-export"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
databrain-connector-core = { version = "0.1.0", path = "../connector-core" }
databrain-result-store = { version = "0.1.0", path = "../result-store" }
parquet = { version = "59.3.0", default-features = false, features = ["arrow", "snap", "zstd"] }
rust_xlsxwriter = { version = "0.96.0", features = ["constant_memory"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
