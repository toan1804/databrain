[package]
name = "databrain-connector-cloud"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["snowflake", "databricks", "bigquery"]
snowflake = []
databricks = []
bigquery = []

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
databrain-auth = { version = "0.1.0", path = "../../auth" }
databrain-connector-core = { version = "0.1.0", path = "../../connector-core" }
flate2 = "1.1.10"
futures = "0.3.34"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "json", "gzip", "http2", "charset", "query"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "sync", "macros", "time"] }
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
