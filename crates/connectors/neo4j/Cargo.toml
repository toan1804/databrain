[package]
name = "databrain-connector-neo4j"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1.92"
databrain-auth = { version = "0.2.0", path = "../../auth" }
databrain-connector-core = { version = "0.2.0", path = "../../connector-core" }
neo4rs = "=0.8.0"
chrono = { version = "0.4.45", default-features = false }
secrecy = "0.10.3"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "sync", "macros", "time"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
