[package]
name = "databrain-connector-oracle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1.92"
databrain-auth = { version = "0.1.0", path = "../../auth" }
databrain-connector-core = { version = "0.1.0", path = "../../connector-core" }
flate2 = "1.1.10"
futures = "0.3.34"
hex = "0.4.3"
oracle = "0.6.3"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "http2"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tokio = { version = "1.53.1", features = ["rt", "sync", "macros", "time", "net", "process", "io-util"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
