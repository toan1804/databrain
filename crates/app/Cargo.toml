[package]
name = "databrain-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
default-run = "databrain"

[lints]
workspace = true

[lib]
name = "databrain_app"
path = "src/lib.rs"

[[bin]]
name = "databrain"
path = "src/main.rs"

[[bin]]
name = "databrain-mcp"
path = "src/bin/databrain-mcp.rs"

[[bin]]
name = "databrain-jobs"
path = "src/bin/databrain-jobs.rs"

[dependencies]
futures = "0.3.34"
async-trait = "0.1.92"
databrain-ai = { version = "0.2.1", path = "../ai" }
databrain-auth = { version = "0.2.1", path = "../auth" }
databrain-connector-cloud = { version = "0.2.1", path = "../connectors/cloud", default-features = false, optional = true }
databrain-connector-core = { version = "0.2.1", path = "../connector-core" }
databrain-lineage = { version = "0.2.1", path = "../lineage" }
base64 = "0.23.1"
databrain-connector-duckdb = { version = "0.2.1", path = "../connectors/duckdb", optional = true, default-features = false }
databrain-connector-mongodb = { version = "0.2.1", path = "../connectors/mongodb", optional = true }
databrain-connector-mssql = { version = "0.2.1", path = "../connectors/mssql", optional = true }
databrain-connector-neo4j = { version = "0.2.1", path = "../connectors/neo4j", optional = true }
databrain-connector-mysql = { version = "0.2.1", path = "../connectors/mysql", optional = true }
databrain-connector-oracle = { version = "0.2.1", path = "../connectors/oracle", optional = true }
databrain-connector-postgres = { version = "0.2.1", path = "../connectors/postgres", optional = true }
databrain-connector-sqlite = { version = "0.2.1", path = "../connectors/sqlite", optional = true }
databrain-export = { version = "0.2.1", path = "../export" }
databrain-query-engine = { version = "0.2.1", path = "../query-engine" }
databrain-result-store = { version = "0.2.1", path = "../result-store" }
databrain-workspace = { version = "0.2.1", path = "../workspace" }
dirs = "7.0.0"
# DBeaver's credentials-config.json (AES-128-CBC) and DataGrip's dataSources.xml.
aes = "=0.8.4"
cbc = { version = "=0.1.2", features = ["alloc"] }
quick-xml = "=0.38.4"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "json"] }
parking_lot = "0.12.5"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.19"
uuid = { version = "1.26.1", features = ["v4"] }

# Linux: build OpenSSL from source and link it statically, so the binary
# does not depend on the distribution's libssl version.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59.0", features = ["Win32_System_Console"] }

[target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "0.10.81", features = ["vendored"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }


[dev-dependencies]
tempfile = "3.27.0"
rust_xlsxwriter = "0.96.0"

[features]
default = ["sqlite", "postgres", "mysql", "mssql", "oracle", "snowflake", "databricks", "bigquery", "duckdb", "mongodb", "neo4j"]
# Every connector, with the DuckDB library installed on the computer instead
# of the bundled engine (smaller app). Build with --no-default-features:
#   node scripts/build-system-duckdb.mjs
system-duckdb = ["sqlite", "postgres", "mysql", "mssql", "oracle", "snowflake", "databricks", "bigquery", "duckdb-system", "mongodb", "neo4j"]
duckdb-system = ["duckdb-engine", "databrain-connector-duckdb?/system"]
sqlite = ["dep:databrain-connector-sqlite"]
postgres = ["dep:databrain-connector-postgres"]
mysql = ["dep:databrain-connector-mysql"]
mssql = ["dep:databrain-connector-mssql"]
oracle = ["dep:databrain-connector-oracle"]
mongodb = ["dep:databrain-connector-mongodb"]
neo4j = ["dep:databrain-connector-neo4j"]
snowflake = ["dep:databrain-connector-cloud", "databrain-connector-cloud/snowflake"]
databricks = ["dep:databrain-connector-cloud", "databrain-connector-cloud/databricks"]
bigquery = ["dep:databrain-connector-cloud", "databrain-connector-cloud/bigquery"]
# DuckDB compiled into the app (default).
duckdb = ["duckdb-engine", "databrain-connector-duckdb?/bundled"]
# The DuckDB connector, whichever engine (code uses this cfg).
duckdb-engine = ["dep:databrain-connector-duckdb"]
