[package]
name = "databrain-auth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aes-gcm = "0.11.1"
async-trait = "0.1.92"
# RSA signing (key-pair JWT) and SHA-256: constant-time, already built for rustls/russh.
aws-lc-rs = "1.18.1"
base64 = "0.23.1"
dirs = "7.0.0"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service"] }
pkcs8 = { version = "0.10.2", features = ["encryption", "pem"] }
rand = "0.8"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "json", "form", "query", "http2", "charset"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-util = "0.7.19"
ts-rs = { version = "11.1", features = ["serde-json-impl", "no-serde-warnings"] }
url = "2.5.8"
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread"] }
