[package]
name = "databrain-query-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
databrain-auth = { version = "0.1.0", path = "../auth" }
databrain-connector-core = { version = "0.1.0", path = "../connector-core" }
databrain-result-store = { version = "0.1.0", path = "../result-store" }
databrain-ssh-tunnel = { version = "0.1.0", path = "../ssh-tunnel" }
databrain-workspace = { version = "0.1.0", path = "../workspace" }
parking_lot = "0.12.5"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt", "sync", "time", "macros"] }
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
databrain-connector-sqlite = { path = "../connectors/sqlite" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
