[package]
name = "databrain-ai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1.92"
bytes = "1.12.1"
databrain-auth = { version = "0.1.0", path = "../auth" }
databrain-connector-core = { version = "0.1.0", path = "../connector-core" }
databrain-query-engine = { version = "0.1.0", path = "../query-engine" }
databrain-result-store = { version = "0.1.0", path = "../result-store" }
databrain-workspace = { version = "0.1.0", path = "../workspace" }
futures = "0.3.34"
parking_lot = "0.12.5"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "json", "stream", "http2", "charset"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt", "sync", "macros", "time", "net", "io-util", "process"] }
tokio-util = "0.7.19"
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
async-trait = "0.1.92"
databrain-connector-duckdb = { path = "../connectors/duckdb" }
databrain-connector-sqlite = { path = "../connectors/sqlite" }
parking_lot = "0.12.5"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
uuid = "1.26.1"
