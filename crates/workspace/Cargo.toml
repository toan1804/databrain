[package]
name = "databrain-workspace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
databrain-auth = { version = "0.3.2", path = "../auth" }
databrain-connector-core = { version = "0.3.2", path = "../connector-core" }
parking_lot = "0.12.5"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
ts-rs = { version = "11.1", features = ["serde-json-impl", "no-serde-warnings"] }
uuid = { version = "1.26.1", features = ["v4"] }
