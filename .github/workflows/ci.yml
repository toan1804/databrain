# Build and test on macOS, Linux and Windows for every push to main and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      # aws-lc-sys needs NASM on Windows; use its prebuilt objects instead.
      AWS_LC_SYS_PREBUILT_NASM: ${{ startsWith(matrix.os, 'windows') && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7

      - name: Linux system packages (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Rust format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: UI dependencies
        working-directory: ui
        run: npm ci

      - name: UI lint
        if: runner.os == 'Linux'
        working-directory: ui
        run: npm run lint

      - name: UI tests
        working-directory: ui
        run: npm test

      # The app embeds ui/dist at compile time.
      - name: UI build
        working-directory: ui
        run: npm run build

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Rust tests
        run: cargo test --workspace --no-fail-fast

      # `cargo test` writes the TypeScript bindings of the Rust types (ts-rs):
      # they must be the ones committed.
      - name: TypeScript bindings up to date
        if: runner.os == 'Linux'
        run: |
          git status --porcelain ui/src/lib/bindings
          test -z "$(git status --porcelain ui/src/lib/bindings)" || { echo "Run cargo test and commit ui/src/lib/bindings"; exit 1; }

  # Dependencies: RustSec advisories, licenses, sources (deny.toml).
  deny:
    name: cargo deny
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # The oldest Rust the workspace supports (rust-version in Cargo.toml) still
  # builds it; the test job uses the latest stable.
  msrv:
    name: Rust 1.88 (MSRV)
    runs-on: ubuntu-22.04
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      - name: Linux system packages (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@1.120
      - uses: Swatinem/rust-cache@v2
      # The app embeds ui/dist; a placeholder page is enough to check it compiles.
      - run: mkdir -p ui/dist && echo '<!doctype html>' > ui/dist/index.html && cargo check --workspace --all-targets

  # The UI in Chromium against a mocked backend (ui/e2e): the explorer, the
  # job canvas and the AI panel.
  e2e:
    name: UI smoke tests (Playwright)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: UI dependencies
        working-directory: ui
        run: npm ci
      - name: Chromium
        working-directory: ui
        run: npx playwright install --with-deps chromium
      - name: Smoke tests
        working-directory: ui
        run: npm run e2e
      - name: Report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            ui/playwright-report
            ui/test-results
          retention-days: 7

  # Tests against real servers. They are #[ignore]d in `cargo test` (so a
  # run without servers reports them as ignored, not passed) and run here
  # with --ignored; a missing server makes them fail, never skip.
  live:
    name: live databases (ubuntu)
    runs-on: ubuntu-22.04
    env:
      CARGO_TERM_COLOR: always
      DATABRAIN_PG_HOST: 127.0.0.1
      DATABRAIN_PG_PORT: 5432
      DATABRAIN_PG_PASSWORD: pw
      DATABRAIN_MYSQL_HOST: 127.0.0.1
      DATABRAIN_MYSQL_PORT: 3306
      DATABRAIN_MYSQL_PASSWORD: pw
      DATABRAIN_MONGO_URI: mongodb://127.0.0.1:27017
      DATABRAIN_CLICKHOUSE_HOST: 127.0.0.1
      DATABRAIN_CLICKHOUSE_PASSWORD: databrain
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pw
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: pw
        ports: ["3306:3306"]
        options: --health-cmd "mysqladmin ping -h 127.0.0.1 -ppw" --health-interval 5s --health-timeout 5s --health-retries 30
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
      clickhouse:
        image: clickhouse/clickhouse-server:25.8
        env:
          CLICKHOUSE_PASSWORD: databrain
        ports: ["8123:8123"]
        options: >-
          --health-cmd "wget -qO- http://localhost:8123/ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - name: Linux system packages (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The app embeds ui/dist at compile time.
      - name: UI build
        working-directory: ui
        run: npm ci && npm run build

      # Redshift needs an AWS cluster (DATABRAIN_REDSHIFT_HOST): not here.
      - name: Live tests (Postgres, MySQL, MongoDB, ClickHouse)
        run: cargo test -p databrain-connector-postgres -p databrain-connector-mysql -p databrain-connector-mongodb -p databrain-connector-clickhouse -p databrain-app --no-fail-fast -- --ignored --skip live_redshift
