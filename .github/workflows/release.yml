# Installers for macOS (Apple Silicon, Intel), Windows and Linux, attached to
# a draft GitHub release for the pushed tag (vX.Y.Z). Review the draft, then
# publish it: the app's update check only sees published releases.
#
# The builds are not code-signed: macOS asks to confirm the first open
# (right-click → Open) and Windows SmartScreen warns once.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build (e.g. v0.3.0)
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-14
            target: aarch64-apple-darwin
            script: app:build
          - name: macOS Apple Silicon (no DuckDB)
            os: macos-14
            target: aarch64-apple-darwin
            script: app:build:no-duckdb
          - name: macOS Intel
            os: macos-13
            target: x86_64-apple-darwin
            script: app:build
          - name: Windows x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            script: app:build
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            script: app:build
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Linux system packages (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ matrix.script }}

      - name: UI dependencies
        working-directory: ui
        run: npm ci

      # DuckDB's extensions for this target are downloaded by the build
      # (fetch:duckdb-ext reads TAURI_ENV_TARGET_TRIPLE). The Oracle thin
      # driver is not built here (no Go): the app downloads the published one.
      - name: Build
        working-directory: ui
        shell: bash
        run: npm run ${{ matrix.script }} -- --target ${{ matrix.target }}

      - name: Attach installers to the draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: DataBrain ${{ env.TAG }}
          draft: true
          fail_on_unmatched_files: false
          files: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            target/${{ matrix.target }}/release/bundle/rpm/*.rpm
