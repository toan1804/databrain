# Installers for macOS (Apple Silicon, Intel), Windows and Linux, attached to
# a draft GitHub release for the pushed tag (vX.Y.Z). Review the draft, then
# publish it: the app's update check only sees published releases.
#
# Signing (each part is skipped when its secrets are missing; see
# docs/RELEASING.md):
# - macOS: Developer ID signing and notarization (APPLE_CERTIFICATE,
#   APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID,
#   APPLE_PASSWORD, APPLE_TEAM_ID). Unsigned builds make macOS ask to
#   confirm the first open (right-click → Open).
# - In-app updates: Tauri updater bundles signed with
#   TAURI_SIGNING_PRIVATE_KEY (+ _PASSWORD), the public key in the
#   repository variable TAURI_UPDATER_PUBKEY, and latest.json on the release.
#   Builds without it show a download link instead of "Install".
# Windows builds are not code-signed (SmartScreen warns once).
#
# Every installer gets a build provenance attestation (verify with
# `gh attestation verify <file> --repo <owner>/<repo>`), and the release a
# SHA256SUMS file listing all its files.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build (e.g. v0.3.0)
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
            script: app:build
          - name: macOS Apple Silicon (no DuckDB)
            os: macos-15
            target: aarch64-apple-darwin
            script: app:build:no-duckdb
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            script: app:build
          - name: Windows x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            script: app:build
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            script: app:build
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      # Build provenance attestations (signed with the workflow's OIDC token).
      id-token: write
      attestations: write
    env:
      CARGO_TERM_COLOR: always
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      # aws-lc-sys needs NASM on Windows; use its prebuilt objects instead.
      AWS_LC_SYS_PREBUILT_NASM: ${{ startsWith(matrix.os, 'windows') && '1' || '0' }}
      MACOS_SIGN: ${{ startsWith(matrix.os, 'macos') && secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_SIGNING_IDENTITY != '' }}
      UPDATER: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && vars.TAURI_UPDATER_PUBKEY != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Linux system packages (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ matrix.script }}

      - name: UI dependencies
        working-directory: ui
        run: npm ci

      # A keychain of its own holds the Developer ID certificate for codesign.
      - name: Import the Developer ID certificate
        if: env.MACOS_SIGN == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          kpw="$(openssl rand -hex 16)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kpw" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kpw" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$kpw" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      # DuckDB's extensions for this target are downloaded by the build
      # (fetch:duckdb-ext reads TAURI_ENV_TARGET_TRIPLE); signed macOS builds
      # ship them gzipped (notarization). The Oracle thin driver is not built
      # here (no Go): the app downloads the published one.
      - name: Build
        working-directory: ui
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ env.MACOS_SIGN == 'true' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ env.MACOS_SIGN == 'true' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ env.MACOS_SIGN == 'true' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ env.MACOS_SIGN == 'true' && secrets.APPLE_TEAM_ID || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.UPDATER == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.UPDATER == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          DUCKDB_EXT_GZIP: ${{ env.MACOS_SIGN == 'true' && '1' || '0' }}
        run: |
          # A variable that is set (even empty) makes the bundler sign or notarize.
          for v in APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            [ -n "${!v}" ] || unset "$v"
          done
          extra=()
          if [ "$UPDATER" = "true" ]; then
            node -e 'process.stdout.write(JSON.stringify({bundle: {createUpdaterArtifacts: true}, plugins: {updater: {pubkey: process.env.TAURI_UPDATER_PUBKEY}}}))' > "$RUNNER_TEMP/updater.conf.json"
            extra=(--config "$RUNNER_TEMP/updater.conf.json")
          fi
          npm run ${{ matrix.script }} -- --target ${{ matrix.target }} "${extra[@]}"

      - name: Check the signature and notarization
        if: env.MACOS_SIGN == 'true'
        run: |
          app="$(ls -d target/${{ matrix.target }}/release/bundle/macos/*.app | head -1)"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose "$app"
          xcrun stapler validate "$app"

      # Updater bundles get names of their own (the macOS one is always
      # DataBrain.app.tar.gz); scripts/updater-manifest.mjs reads them.
      - name: Name the updater bundles
        if: env.UPDATER == 'true'
        shell: bash
        run: |
          b="target/${{ matrix.target }}/release/bundle"
          ver="${TAG#v}"
          mkdir -p updater
          if [ -f "$b/macos/DataBrain.app.tar.gz" ]; then
            name="DataBrain_${ver}_${{ startsWith(matrix.target, 'aarch64') && 'aarch64' || 'x64' }}${{ matrix.script == 'app:build:no-duckdb' && '-no-duckdb' || '' }}.app.tar.gz"
            cp "$b/macos/DataBrain.app.tar.gz" "updater/$name"
            cp "$b/macos/DataBrain.app.tar.gz.sig" "updater/$name.sig"
          fi
          cp "$b"/nsis/*-setup.exe.sig updater/ 2>/dev/null || true
          cp "$b"/appimage/*.AppImage.sig updater/ 2>/dev/null || true
          ls -l updater

      # The no-DuckDB build must stay under 30 MB (AGENTS.md): fail the
      # release before anything is attached when a download is bigger.
      - name: Check the no-DuckDB download size
        if: matrix.script == 'app:build:no-duckdb'
        shell: bash
        run: |
          limit=30000000
          fail=0
          b="target/${{ matrix.target }}/release/bundle"
          for f in "$b"/dmg/*.dmg "$b"/macos/*.app.tar.gz; do
            [ -f "$f" ] || continue
            size=$(wc -c < "$f" | tr -d ' ')
            echo "$(basename "$f"): $size bytes (limit $limit)"
            if [ "$size" -gt "$limit" ]; then
              echo "::error::$(basename "$f") is $size bytes, over the 30 MB limit for the no-DuckDB build"
              fail=1
            fi
          done
          exit $fail

      # Signed statement that these files were built by this workflow from
      # this commit, recorded in the repository's attestations.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            updater/*

      - name: Attach installers to the draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: DataBrain ${{ env.TAG }}
          draft: true
          fail_on_unmatched_files: false
          files: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            updater/*

  # latest.json for the Tauri updater, from the .sig files the builds attached.
  updater-manifest:
    name: Updater manifest
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      UPDATER: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && vars.TAURI_UPDATER_PUBKEY != '' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        if: env.UPDATER == 'true'
        with:
          ref: ${{ env.TAG }}
      - name: Write and attach latest.json
        if: env.UPDATER == 'true'
        run: |
          mkdir -p sigs
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.sig' --dir sigs
          node scripts/release-notes.mjs "$TAG" > notes.md || : > notes.md
          node scripts/updater-manifest.mjs sigs "$TAG" "$GITHUB_REPOSITORY" notes.md > latest.json
          cat latest.json
          gh release upload "$TAG" latest.json --repo "$GITHUB_REPOSITORY" --clobber

  # The release's description: the version's section of CHANGELOG.md
  # (what the app's "What's new" opens). The draft stays a draft.
  release-notes:
    name: Release notes
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Set the release description from CHANGELOG.md
        run: |
          if node scripts/release-notes.mjs "$TAG" > notes.md; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          else
            echo "::warning::CHANGELOG.md has no section for $TAG: the release has no description"
          fi

  # SHA256SUMS of every file on the release (installers, updater bundles,
  # latest.json), attested like the installers.
  checksums:
    name: Checksums
    needs: [build, updater-manifest]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Write SHA256SUMS
        run: |
          mkdir assets && cd assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY"
          rm -f SHA256SUMS
          sha256sum -- * > ../SHA256SUMS
          cat ../SHA256SUMS
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: SHA256SUMS
      - name: Attach SHA256SUMS
        run: gh release upload "$TAG" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
