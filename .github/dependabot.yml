# Dependency updates, grouped weekly so they arrive as a few pull requests.
# Security updates also need "Dependabot security updates" turned on in the
# repository settings.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rust-minor:
        update-types: [minor, patch]
    # Vendored copies with an addition of ours (vendor/*/DATABRAIN.md): the
    # version in Cargo.toml doesn't build anything; updating means copying
    # the new release and applying the change again.
    ignore:
      - dependency-name: mysql_async
      - dependency-name: tiberius

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      ui-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    # Its ref is the Rust toolchain (`@stable`, `@nightly`, `@1.89` = the
    # MSRV), not a version of the action: never "update" it.
    ignore:
      - dependency-name: dtolnay/rust-toolchain

  # The Oracle driver helper: its binaries are pinned by agent/SHA256SUMS, so
  # an update needs a new helper release (docs/RELEASING.md) before merging.
  - package-ecosystem: gomod
    directory: /crates/connectors/oracle/agent
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    # A vendored copy (agent/go-ora/DATABRAIN.md, `replace` in go.mod): the
    # required version builds nothing; updating means copying the release.
    ignore:
      - dependency-name: github.com/sijms/go-ora/v2
