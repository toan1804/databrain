[workspace]
resolver = "3"
members = [
    "crates/auth",
    "crates/connector-core",
    "crates/ssh-tunnel",
    "crates/connectors/sqlite",
    "crates/connectors/postgres",
    "crates/connectors/mysql",
    "crates/connectors/mssql",
    "crates/connectors/oracle",
    "crates/connectors/cloud",
    "crates/connectors/duckdb",
    "crates/result-store",
    "crates/export",
    "crates/workspace",
    "crates/query-engine",
    "crates/ai",
    "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
